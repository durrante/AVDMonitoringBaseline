name: ✨ Enhancement Request
description: Suggest a new feature or an improvement
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Good ideas make the project better for everyone.

        📋 **Before you start:** please search the existing issues to check this has not already been suggested.
  - type: checkboxes
    id: no-duplicate
    attributes:
      label: Duplicate check
      options:
        - label: I have searched the existing issues and this has not already been requested
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your request related to a frustration or a gap? Tell us the why.
      placeholder: I find it difficult when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about?
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: 📎 Add any other context, mockups or screenshots here.
    validations:
      required: false
